# Small Apple-silicon Metal benchmark/example. Ranges are inclusive.

algorithm = Vanilla-3
scanOrder = linear
directions = [0]

xRange = (-1000, 1000)
yRange = (-60, 0)
zRange = (-1000, 1000)

errorTolerance = 0

# Kept for compatibility with WebCoordsFinder and native CoordsFinder.
cpuTileSize = (1024, 1024)
cudaTileSize = (16384, 16384)
verbose = false

[filter]
# x y z | variant [side]
0 0 0 | 0
1 0 0 | 1
2 0 0 | 2
3 0 0 | 3
0 0 1 | 1
1 0 1 | 2
2 0 1 | 3
3 0 1 | 0
0 0 2 | 2
1 0 2 | 3
2 0 2 | 0
3 0 2 | 1
0 0 3 | 3
1 0 3 | 0
2 0 3 | 1
3 0 3 | 2
